name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate sources.yaml
        run: python3 scripts/validate_sources.py
      - name: Offline index tests
        run: python3 scripts/test_index.py

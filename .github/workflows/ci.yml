name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate sources.yaml
        run: python3 scripts/validate_sources.py
      - name: Offline index tests
        run: python3 scripts/test_index.py
      - name: Offline collector tests
        run: python3 scripts/test_collect.py
      - name: Offline backfill tests
        run: python3 scripts/backfill/test_backfill.py
      - name: Validate committed backfill
        run: python3 scripts/backfill/validate.py

name: Daily feed fetch

# 11:00 UTC daily, including weekends — threat intel is time-critical.
# That is morning in America/Sao_Paulo. workflow_dispatch is the dry-run path;
# CI does not fetch third-party URLs on every pull request.
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Date
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Fetch cataloged URLs
        run: bash scripts/fetch.sh output
      - name: Upload day's artifact
        uses: actions/upload-artifact@v4
        with:
          name: threat-intel-${{ steps.date.outputs.date }}
          path: output/
          if-no-files-found: error
          retention-days: 14
      - name: Pack release assets
        env:
          DATE: ${{ steps.date.outputs.date }}
        run: |
          set -euo pipefail
          test -f output/summary.md
          cp output/summary.md "summary-${DATE}.md"
          tar czf "threat-intel-${DATE}.tar.gz" output/
      - name: Write release notes
        env:
          DATE: ${{ steps.date.outputs.date }}
        run: |
          set -euo pipefail
          {
            echo "# Threat-intel fetch — ${DATE} UTC"
            echo
            echo "Feeds-only snapshot of cataloged public RSS/Atom/JSON URLs."
            echo "Raw bodies plus \`summary.md\` in catalog document order."
            echo "No ranking, classes, adapters, or scores."
            echo
            echo "The excerpt below is the first ~80 lines of the day's index."
            echo "The full index is attached as \`summary-${DATE}.md\`."
            echo "The same payload as today's Actions artifact is \`threat-intel-${DATE}.tar.gz\`."
            echo
            echo "---"
            echo
            head -n 80 output/summary.md
          } > release-notes.md
      - name: Publish daily Release
        env:
          GH_TOKEN: ${{ github.token }}
          DATE: ${{ steps.date.outputs.date }}
        run: |
          set -euo pipefail
          TAG="daily-${DATE}"
          TITLE="Threat-intel fetch — ${DATE} UTC"
          ASSETS=("summary-${DATE}.md" "threat-intel-${DATE}.tar.gz")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file release-notes.md --latest
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "$TITLE" \
              --notes-file release-notes.md \
              --latest
          fi

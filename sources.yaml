# Public catalog of threat-intel RSS/Atom feeds and official JSON catalogs.
# Package and cite only. No ranking, classes, adapters, or scores live here.
# URLs below returned HTTP 200 on 2026-09-03.

sources:
  # --- web2 ---
  - id: cisa-kev
    name: CISA KEV catalog JSON
    url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
    format: json
    surface: web2
    why: Official KEV catalog; CISA retired the KEV RSS feed in 2025.

  - id: circl-kev
    name: CIRCL Vulnerability-Lookup CISA KEV Atom
    url: https://vulnerability.circl.lu/known-exploited-vulnerabilities.atom
    format: atom
    surface: web2
    why: Third-party Atom feed of the same CISA KEV list.

  - id: github-security-blog
    name: GitHub Security blog RSS
    url: https://github.blog/security/feed/
    format: rss
    surface: web2
    why: Official GitHub Security blog posts.

  - id: github-advisory-database
    name: GitHub advisory-database commits Atom
    url: https://github.com/github/advisory-database/commits/main.atom
    format: atom
    surface: web2
    why: Change signal for the GHSA dump; not a per-advisory RSS.

  - id: msrc-update-guide
    name: MSRC Security Update Guide RSS
    url: https://api.msrc.microsoft.com/update-guide/rss
    format: rss
    surface: web2
    why: Microsoft Security Response Center Security Update Guide feed.

